name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.23.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check gofmt
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $exe = if ($IsWindows) { "bin/agent-vcr.exe" } else { "bin/agent-vcr" }
          go build -o $exe ./cmd/agent-vcr

      - name: Help smoke test
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "bin/agent-vcr.exe" } else { "bin/agent-vcr" }
          & $exe --help

      - name: Behavior smoke test
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "bin/agent-vcr.exe" } else { "bin/agent-vcr" }
          & $exe behavior --help

      - name: Doctor smoke test
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "bin/agent-vcr.exe" } else { "bin/agent-vcr" }
          & $exe doctor

      - name: E2E fixtures
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { "bin/agent-vcr.exe" } else { "bin/agent-vcr" }
          ./scripts/e2e.ps1 -AgentVCR $exe
